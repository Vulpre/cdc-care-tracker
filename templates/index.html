<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login – CDC Care Tracker</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');
:root{
  --bg:#FAF8F3; --white:#fff; --ink:#1E2A26; --ink-soft:#5B655F;
  --primary:#1C4F40; --accent:#E8A33D; --line:#D8D3C4; --alert:#B7402C;
  --font-display:'Fraunces',serif; --font-body:'IBM Plex Sans',sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%; font-family:var(--font-body); background:var(--bg); color:var(--ink);}
body{display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px;}
a{color:var(--primary); text-decoration:none; font-weight:600;}
a:hover{text-decoration:underline;}

.card{
  width:100%; max-width:420px; background:var(--white);
  border:1px solid var(--line); border-radius:20px; padding:40px 36px;
  box-shadow:0 12px 40px rgba(0,0,0,0.07);
}

.logo{text-align:center; margin-bottom:28px;}
.logo-icon{
  width:64px; height:64px; border-radius:16px; background:var(--primary);
  display:inline-flex; align-items:center; justify-content:center;
  font-size:28px; color:var(--accent); margin-bottom:14px;
}
.logo-title{font-family:var(--font-display); font-size:22px; font-weight:700; color:var(--primary);}
.logo-sub{font-size:13px; color:var(--ink-soft); margin-top:4px;}

.error-box{
  background:rgba(183,64,44,0.08); border:1px solid rgba(183,64,44,0.3);
  border-left:4px solid var(--alert); border-radius:10px;
  padding:12px 16px; font-size:13px; color:var(--alert); margin-bottom:20px;
  display:flex; align-items:center; gap:10px;
}

.field-label{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:var(--ink-soft); display:block; margin-bottom:8px;}
.field-wrap{position:relative; margin-bottom:18px;}
.input{
  border:1.5px solid var(--line); background:var(--white); border-radius:10px;
  padding:14px 44px 14px 16px; font-size:14px; color:var(--ink); width:100%;
  outline:none; transition:border-color 0.2s, box-shadow 0.2s; font-family:var(--font-body);
}
.input:focus{border-color:var(--primary); box-shadow:0 0 0 3px rgba(28,79,64,0.12);}
.input.error{border-color:var(--alert);}
.toggle-pw{
  position:absolute; right:14px; top:50%; transform:translateY(-50%);
  background:none; border:none; cursor:pointer; color:var(--ink-soft); font-size:16px; padding:4px;
}
.toggle-pw:hover{color:var(--primary);}

.btn-primary{
  display:block; width:100%; background:var(--accent); color:var(--ink);
  font-weight:700; font-size:15px; border-radius:10px; padding:15px;
  text-align:center; border:none; cursor:pointer; font-family:var(--font-body);
  transition:filter 0.2s, opacity 0.2s; margin-top:4px;
}
.btn-primary:hover{filter:brightness(0.93);}
.btn-primary:disabled{opacity:0.7; cursor:not-allowed;}

.footer-links{
  display:flex; justify-content:center; margin-top:20px;
  font-size:13px; color:var(--ink-soft); gap:6px;
}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon"><i class="fa-solid fa-children"></i></div>
    <div class="logo-title">CDC Care Tracker</div>
    <div class="logo-sub">Barangay Child Development Center</div>
  </div>

  {% if error %}
  <div class="error-box">
    <i class="fa-solid fa-circle-exclamation"></i>
    {{ error }}
  </div>
  {% endif %}

  <form method="POST" action="/" id="login-form">
    {% csrf_token %}

    <label class="field-label" for="username">Username or Email</label>
    <div class="field-wrap">
      <input
        class="input {% if error %}error{% endif %}"
        type="text" name="username" id="username"
        value="{{ username }}"
        placeholder="Enter your username or email"
        autocomplete="username" autofocus required>
    </div>

    <label class="field-label" for="password">Password</label>
    <div class="field-wrap">
      <input
        class="input {% if error %}error{% endif %}"
        type="password" name="password" id="password"
        placeholder="Enter your password"
        autocomplete="current-password" required>
      <button type="button" class="toggle-pw" id="toggle-pw" aria-label="Show/hide password">
        <i class="fa-solid fa-eye" id="pw-icon"></i>
      </button>
    </div>

    <button type="submit" class="btn-primary" id="submit-btn">
      Log In
    </button>
  </form>

  <div class="footer-links">
    <span>Forgot your password?</span>
    <a href="/password-reset/">Reset it here</a>
  </div>
  <div class="footer-links" style="margin-top:10px;">
    <span>Don't have an account?</span>
    <a href="{% url 'register' %}">Create Account</a>
  </div>
</div>

<script>
// Show / hide password
const toggle = document.getElementById('toggle-pw');
const pwInput = document.getElementById('password');
const pwIcon  = document.getElementById('pw-icon');
toggle.addEventListener('click', () => {
  const isHidden = pwInput.type === 'password';
  pwInput.type = isHidden ? 'text' : 'password';
  pwIcon.className = isHidden ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
});

// Loading state on submit
document.getElementById('login-form').addEventListener('submit', function() {
  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Logging in…';
});
</script>
</body>
</html>
