<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password – CDC Care Tracker</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=IBM+Plex+Sans:wght@400;600;700&display=swap');
:root{--bg:#FAF8F3;--white:#fff;--ink:#1E2A26;--ink-soft:#5B655F;--primary:#1C4F40;--accent:#E8A33D;--line:#D8D3C4;--ok:#1A6E3C;--ok-bg:#EBF7F0;--ok-line:#A3D9BC;--font-display:'Fraunces',serif;--font-body:'IBM Plex Sans',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:var(--font-body);background:var(--bg);color:var(--ink);}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
a{color:var(--primary);text-decoration:none;font-weight:600;}
a:hover{text-decoration:underline;}
.card{width:100%;max-width:420px;background:var(--white);border:1px solid var(--line);border-radius:20px;padding:40px 36px;box-shadow:0 12px 40px rgba(0,0,0,.07);}
.back{font-size:13px;display:flex;align-items:center;gap:6px;margin-bottom:24px;}
.title{font-family:var(--font-display);font-size:22px;font-weight:700;color:var(--primary);margin-bottom:8px;}
.sub{font-size:14px;color:var(--ink-soft);line-height:1.6;margin-bottom:28px;}
.field-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft);display:block;margin-bottom:8px;}
.input{border:1.5px solid var(--line);background:var(--white);border-radius:10px;padding:14px 16px;font-size:14px;color:var(--ink);width:100%;outline:none;transition:border-color .2s,box-shadow .2s;font-family:var(--font-body);margin-bottom:18px;}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(28,79,64,.12);}
.btn-primary{display:block;width:100%;background:var(--accent);color:var(--ink);font-weight:700;font-size:15px;border-radius:10px;padding:15px;text-align:center;border:none;cursor:pointer;font-family:var(--font-body);transition:filter .2s;}
.btn-primary:hover{filter:brightness(.93);}
.success{background:var(--ok-bg);border:1px solid var(--ok-line);border-left:4px solid var(--ok);border-radius:10px;padding:16px;font-size:14px;color:var(--ok);line-height:1.6;}
</style>
</head>
<body>
<div class="card">
  <div class="back"><a href="/"><i class="fa-solid fa-arrow-left"></i> Back to Login</a></div>
  <div class="title">Reset your password</div>
  <div class="sub">Enter the username's associated email address and we will send a link to reset your password.</div>

  {% if sent %}
    <div class="success">
      <i class="fa-solid fa-circle-check"></i>
      <strong>Email sent!</strong><br>
      If that email is registered, you'll receive a reset link shortly. Check your inbox (and spam folder).
    </div>
  {% else %}
    <form method="POST">
      {% csrf_token %}
      <label class="field-label" for="id_email">Email address</label>
      <input class="input" type="email" name="email" id="id_email" placeholder="you@example.com" required autocomplete="email">
      <button type="submit" class="btn-primary">Send Reset Link</button>
    </form>
  {% endif %}
</div>
</body>
</html>
