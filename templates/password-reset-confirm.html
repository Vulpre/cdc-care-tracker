<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set New Password – CDC Care Tracker</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=IBM+Plex+Sans:wght@400;600;700&display=swap');
:root{--bg:#FAF8F3;--white:#fff;--ink:#1E2A26;--ink-soft:#5B655F;--primary:#1C4F40;--accent:#E8A33D;--line:#D8D3C4;--alert:#B7402C;--font-display:'Fraunces',serif;--font-body:'IBM Plex Sans',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:var(--font-body);background:var(--bg);color:var(--ink);}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
a{color:var(--primary);text-decoration:none;font-weight:600;}
.card{width:100%;max-width:420px;background:var(--white);border:1px solid var(--line);border-radius:20px;padding:40px 36px;box-shadow:0 12px 40px rgba(0,0,0,.07);}
.title{font-family:var(--font-display);font-size:22px;font-weight:700;color:var(--primary);margin-bottom:8px;}
.sub{font-size:14px;color:var(--ink-soft);line-height:1.6;margin-bottom:28px;}
.field-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft);display:block;margin-bottom:8px;}
.field-wrap{position:relative;margin-bottom:18px;}
.input{border:1.5px solid var(--line);background:var(--white);border-radius:10px;padding:14px 44px 14px 16px;font-size:14px;color:var(--ink);width:100%;outline:none;transition:border-color .2s;font-family:var(--font-body);}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(28,79,64,.12);}
.toggle-pw{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--ink-soft);font-size:16px;padding:4px;}
.btn-primary{display:block;width:100%;background:var(--accent);color:var(--ink);font-weight:700;font-size:15px;border-radius:10px;padding:15px;text-align:center;border:none;cursor:pointer;font-family:var(--font-body);transition:filter .2s;}
.btn-primary:hover{filter:brightness(.93);}
.errorlist{list-style:none;color:var(--alert);font-size:13px;margin-bottom:14px;padding:10px 14px;background:rgba(183,64,44,.07);border-radius:8px;}
</style>
</head>
<body>
<div class="card">
  <div class="title">Set a new password</div>
  <div class="sub">Choose a strong password with at least 8 characters.</div>
  {% if validlink %}
    <form method="POST">
      {% csrf_token %}
      {{ form.non_field_errors }}
      <label class="field-label" for="id_new_password1">New password</label>
      <div class="field-wrap">
        <input class="input" type="password" name="new_password1" id="id_new_password1" required autocomplete="new-password">
        <button type="button" class="toggle-pw" onclick="togglePw('id_new_password1',this)"><i class="fa-solid fa-eye"></i></button>
      </div>
      {{ form.new_password1.errors }}
      <label class="field-label" for="id_new_password2">Confirm password</label>
      <div class="field-wrap">
        <input class="input" type="password" name="new_password2" id="id_new_password2" required autocomplete="new-password">
        <button type="button" class="toggle-pw" onclick="togglePw('id_new_password2',this)"><i class="fa-solid fa-eye"></i></button>
      </div>
      {{ form.new_password2.errors }}
      <button type="submit" class="btn-primary">Set New Password</button>
    </form>
  {% else %}
    <p style="color:var(--alert);font-size:14px;">This reset link is invalid or has expired. <a href="/password-reset/">Request a new one</a>.</p>
  {% endif %}
</div>
<script>
function togglePw(id, btn) {
  const inp = document.getElementById(id);
  const icon = btn.querySelector('i');
  if (inp.type === 'password') { inp.type = 'text'; icon.className = 'fa-solid fa-eye-slash'; }
  else { inp.type = 'password'; icon.className = 'fa-solid fa-eye'; }
}
</script>
</body>
</html>
