{% extends "auth_base.html" %}

{% block title %}Password updated{% endblock %}

{% block content %}
<div class="alert alert-success" role="status">
  <i class="fa-solid fa-circle-check" aria-hidden="true"></i>
  <span>Your password has been changed.</span>
</div>

<h1 class="page-title">You're all set</h1>
<p class="page-sub">Log in with your new password to continue.</p>

<a href="/" class="btn">Go to log in</a>
{% endblock %}
