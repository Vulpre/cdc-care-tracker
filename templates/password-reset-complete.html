<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Password Reset Complete – CDC Care Tracker</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=IBM+Plex+Sans:wght@400;600;700&display=swap');
:root{--bg:#FAF8F3;--white:#fff;--ink:#1E2A26;--ink-soft:#5B655F;--primary:#1C4F40;--accent:#E8A33D;--line:#D8D3C4;--ok:#1A6E3C;--ok-bg:#EBF7F0;--ok-line:#A3D9BC;--font-display:'Fraunces',serif;--font-body:'IBM Plex Sans',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:var(--font-body);background:var(--bg);color:var(--ink);}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
.card{width:100%;max-width:420px;background:var(--white);border:1px solid var(--line);border-radius:20px;padding:48px 36px;box-shadow:0 12px 40px rgba(0,0,0,.07);text-align:center;}
.icon{width:72px;height:72px;border-radius:50%;background:var(--ok-bg);border:3px solid var(--ok-line);color:var(--ok);display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 20px;}
.title{font-family:var(--font-display);font-size:22px;font-weight:700;color:var(--primary);margin-bottom:12px;}
.sub{font-size:14px;color:var(--ink-soft);line-height:1.6;margin-bottom:28px;}
.btn{display:block;background:var(--accent);color:var(--ink);font-weight:700;font-size:15px;border-radius:10px;padding:15px;text-align:center;text-decoration:none;}
.btn:hover{filter:brightness(.93);}
</style>
</head>
<body>
<div class="card">
  <div class="icon"><i class="fa-solid fa-check"></i></div>
  <div class="title">Password updated!</div>
  <div class="sub">Your password has been set successfully. You can now log in with your new password.</div>
  <a href="/" class="btn">Go to Login</a>
</div>
</body>
</html>
