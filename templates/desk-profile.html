<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile - CDC Care Tracker</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');

:root{
  --stage-bg-1:#0F2B22;
  --stage-bg-2:#0A1F19;
  --app-bg:#FAF8F3;
  --ink:#1E2A26;
  --ink-soft:#5B655F;
  --primary:#1C4F40;
  --primary-deep:#123D31;
  --accent:#E8A33D;
  --alert:#B7402C;
  --watch-bg:#FCEACB;
  --watch-text:#8A5A12;
  --ok-line:#8FA89A;
  --ok-bg:#E7F0EA;
  --ok-text:#2F5F45;
  --line:#D8D3C4;
  --font-display:'Fraunces',serif;
  --font-body:'IBM Plex Sans',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  min-height:100vh;
  font-family:var(--font-body);
  color:var(--ink);
  background:radial-gradient(120% 140% at 50% -10%, var(--stage-bg-1) 0%, var(--stage-bg-2) 65%);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px 16px;
}
a{ all:unset; box-sizing:border-box; cursor:pointer; }
input, textarea, select{ font-family:inherit; }

/* phone chrome */
.phone-frame{
  width:min(350px,92vw);
  background:var(--primary-deep);
  border-radius:36px;
  padding:16px 10px 10px;
  box-shadow:0 40px 70px -25px rgba(0,0,0,.55), 0 14px 26px -10px rgba(0,0,0,.4);
  margin:0 auto;
}
.phone-frame .notch{
  width:64px; height:7px; margin:0 auto 10px;
  background:var(--primary-deep); border:2px solid #2A5245; border-radius:6px; flex-shrink:0;
}
.phone-screen-inner{
  background:var(--app-bg); border-radius:26px; height:640px; max-height:82vh;
  position:relative; overflow:hidden; display:flex; flex-direction:column;
}

/* desktop chrome */
.desk-frame{
  width:min(560px,92vw); background:#fff; border-radius:14px; overflow:hidden;
  box-shadow:0 40px 70px -25px rgba(0,0,0,.5);
}
.desk-topbar{ display:flex; align-items:center; gap:8px; padding:10px 14px; background:#EFEDE4; border-bottom:1px solid var(--line); }
.desk-dot{ width:9px; height:9px; border-radius:50%; background:#CFC9B8; }
.desk-url{ font-family:var(--font-mono); font-size:11px; color:var(--ink-soft); background:#fff; border:1px solid var(--line); border-radius:6px; padding:5px 12px; flex:1; }
.desk-screen-inner{ min-height:480px; background:var(--app-bg); display:flex; flex-direction:column; }

/* shared app chrome */
.app-topbar{ display:flex; align-items:center; justify-content:space-between; padding:16px 18px 8px; }
.app-wordmark{ font-family:var(--font-display); font-weight:600; font-size:15px; color:var(--primary); }
.badge{
  min-width:20px; height:20px; padding:0 5px; border-radius:10px; background:var(--alert); color:#fff;
  font-family:var(--font-mono); font-size:10.5px; display:flex; align-items:center; justify-content:center;
}
.back-btn{ display:inline-flex; font-family:var(--font-body); font-size:13px; font-weight:600; color:var(--primary); align-items:center; gap:4px; }

.app-body{ flex:1; padding:6px 18px 20px; display:flex; flex-direction:column; gap:12px; overflow-y:auto; }
.desk-content{ padding:18px 20px; display:flex; flex-direction:column; gap:12px; flex:1; }

.login-title{ font-family:var(--font-display); font-weight:600; font-size:19px; color:var(--primary); }
.login-sub{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
.login-note{ font-size:10.5px; color:var(--ink-soft); text-align:center; margin-top:2px; line-height:1.5; }

.field-label{ font-size:11.5px; color:var(--ink-soft); font-weight:600; }
.field-hint{ font-size:11px; color:var(--ink-soft); margin-top:-6px; }

.input{
  border:1.5px solid var(--line); background:#fff; border-radius:10px; padding:11px 13px;
  font-size:13.5px; color:var(--ink); width:100%;
}
.textarea{ min-height:70px; resize:none; border:1.5px solid var(--line); background:#fff; border-radius:10px; padding:11px 13px; font-size:13px; width:100%; }

.role-toggle{ display:flex; gap:8px; margin-top:4px; }
.role-chip{
  flex:1; display:block; text-align:center; padding:10px 6px; border:1.5px solid var(--line); border-radius:10px;
  font-size:12px; font-weight:600; color:var(--ink-soft); background:#fff;
}
.role-chip.active{ border-color:var(--primary); color:var(--primary); background:rgba(28,79,64,.08); }

.btn{ display:block; font-weight:600; font-size:13.5px; border-radius:10px; padding:13px; text-align:center; width:100%; }
.btn-primary{ background:var(--accent); color:var(--ink); }
.btn-outline{ background:transparent; border:1.5px solid var(--primary); color:var(--primary); }
.btn-small{ display:inline-block; font-size:11px; padding:6px 11px; border-radius:8px; border:1.5px solid var(--primary); color:var(--primary); font-weight:600; }

.list-row{
  display:flex; justify-content:space-between; align-items:center; gap:10px;
  padding:11px 13px; border:1px solid var(--line); border-left:4px solid var(--line);
  border-radius:8px; background:#fff; font-size:13px; width:100%; text-align:left;
}
.list-row.selected{ border-color:var(--primary); border-left-color:var(--primary); }
.list-row.flag{ border-left-color:var(--alert); }
.list-row.watch{ border-left-color:var(--accent); }
.list-row.ok{ border-left-color:var(--ok-line); }

.tag{ font-family:var(--font-mono); font-size:10px; padding:3px 9px; border-radius:20px; white-space:nowrap; }
.tag-flag{ background:var(--alert); color:#fff; }
.tag-watch{ background:var(--watch-bg); color:var(--watch-text); }
.tag-ok{ background:var(--ok-bg); color:var(--ok-text); }

.stat-row{ display:flex; gap:10px; }
.stat-box{ flex:1; background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px; text-align:center; }
.stat-num{ font-family:var(--font-display); font-size:20px; font-weight:600; color:var(--primary); }
.stat-label{ font-size:10.5px; color:var(--ink-soft); margin-top:2px; }

.greeting-card{ background:var(--primary); color:#fff; border-radius:12px; padding:15px 16px; }
.greeting-card .name{ font-family:var(--font-display); font-size:16px; font-weight:600; }
.greeting-card .sub{ font-size:11.5px; opacity:.85; margin-top:3px; }

.quick-actions{ display:flex; gap:10px; }
.action-btn{
  flex:1; display:block; background:#fff; border:1.5px solid var(--primary); border-radius:10px; padding:14px 8px;
  text-align:center; font-weight:600; font-size:12px; color:var(--primary);
}

.section-label{ font-size:12px; color:var(--ink-soft); font-weight:700; margin-top:2px; }

.chip-row{ display:flex; gap:8px; flex-wrap:wrap; }
.chip{ font-size:12px; padding:8px 14px; border-radius:20px; border:1.5px solid var(--line); color:var(--ink-soft); }
.chip.active{ background:var(--primary); border-color:var(--primary); color:#fff; font-weight:600; }

.photo-placeholder{
  height:104px; border-radius:12px; border:1.5px dashed var(--line);
  display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:11px; color:var(--ink-soft);
  background:repeating-linear-gradient(135deg, transparent, transparent 8px, rgba(0,0,0,.03) 8px, rgba(0,0,0,.03) 9px);
}
.name-text{ font-family:var(--font-display); font-weight:600; font-size:16px; }
.meta-text{ font-size:11px; color:var(--ink-soft); margin-top:-6px; }

.attend-strip{ display:flex; gap:6px; }
.attend-dot{ flex:1; height:26px; border-radius:6px; }
.attend-dot.present{ background:var(--ok-bg); border:1px solid var(--ok-line); }
.attend-dot.absent{ background:var(--alert); }

.confirm-wrap{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:24px; text-align:center; }
.confirm-icon{ width:54px; height:54px; border-radius:50%; border:2.5px solid var(--primary); color:var(--primary); display:flex; align-items:center; justify-content:center; font-size:22px; }
.confirm-title{ font-family:var(--font-display); font-size:16px; font-weight:600; }
.confirm-detail{ font-size:12.5px; color:var(--ink-soft); text-align:left; background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 14px; width:100%; line-height:1.6; }

.reminder-banner{
  display:flex; position:absolute; top:60px; left:14px; right:14px; background:var(--ink); color:#fff; border-radius:12px;
  padding:12px 14px; font-size:12px; box-shadow:0 16px 28px -10px rgba(0,0,0,.45); z-index:5;
  align-items:flex-start; gap:8px; line-height:1.4; text-align:left;
}

.tabbar{ border-top:1px solid var(--line); background:#fff; display:flex; justify-content:space-around; padding:10px 4px 14px; margin-top:auto; }
.tab-btn{ display:flex; flex-direction:column; align-items:center; gap:4px; font-size:9.5px; color:var(--ink-soft); }
.tab-btn .dot{ width:16px; height:16px; border-radius:5px; border:1.5px solid var(--line); }
.tab-btn.active{ color:var(--primary); font-weight:700; }
.tab-btn.active .dot{ border-color:var(--primary); background:rgba(28,79,64,.12); }

.desk-nav{ display:flex; gap:8px; padding:12px 16px; border-bottom:1px solid var(--line); }
.nav-pill{ display:block; font-size:12.5px; padding:7px 14px; border-radius:20px; border:1.5px solid var(--line); color:var(--ink-soft); }
.nav-pill.active{ border-color:var(--primary); background:rgba(28,79,64,.08); color:var(--primary); font-weight:700; }

.filters-row{ display:flex; gap:10px; }
.filters-row > div{ flex:1; display:flex; flex-direction:column; gap:5px; }

.mono-text{ font-family:var(--font-mono); font-size:11px; color:var(--ink-soft); }

</style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<div class="desk-frame"><div class="desk-topbar"><span class="desk-dot"></span><span class="desk-dot"></span><span class="desk-dot"></span><span class="desk-url">portal.cdccaretracker.gov.ph</span></div><div class="desk-screen-inner"><div class="desk-nav"><a href="/report/" class="nav-pill">Reports</a><a href="/search/" class="nav-pill">Search</a><a href="/desk-profile/" class="nav-pill active">Profile</a></div>
    <div class="desk-content">
      <div class="name-text">{{ profile.full_name|default:"District Supervisor" }}</div>
      <div class="meta-text">{{ profile.role|default:"District Supervisor" }} &bull; {{ profile.year_section|default:"Curuan District Office" }}</div>
      <div class="list-row ok"><span>Course / Department</span><span class="mono-text">{{ profile.course|default:"BS Information Technology" }}</span></div>
      <a href="/" class="btn btn-outline"><i class="fa-solid fa-right-from-bracket"></i> Log out</a>
    </div></div></div>
</body>
</html>
