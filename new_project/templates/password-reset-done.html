<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check your email – CDC Care Tracker</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=IBM+Plex+Sans:wght@400;600;700&display=swap');
:root{--bg:#FAF8F3;--white:#fff;--ink:#1E2A26;--ink-soft:#5B655F;--primary:#1C4F40;--accent:#E8A33D;--line:#D8D3C4;--font-display:'Fraunces',serif;--font-body:'IBM Plex Sans',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:var(--font-body);background:var(--bg);color:var(--ink);}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
.card{width:100%;max-width:420px;background:var(--white);border:1px solid var(--line);border-radius:20px;padding:48px 36px;box-shadow:0 12px 40px rgba(0,0,0,.07);text-align:center;}
.title{font-family:var(--font-display);font-size:22px;font-weight:700;color:var(--primary);margin-bottom:12px;}
.sub{font-size:14px;color:var(--ink-soft);line-height:1.6;margin-bottom:28px;}
a{color:var(--primary);font-weight:600;}
</style>
</head>
<body>
<div class="card">
  <div style="font-size:48px;margin-bottom:16px;">📧</div>
  <div class="title">Check your email</div>
  <div class="sub">We've sent a password reset link to your email address. The link expires in 24 hours.<br><br>Didn't receive it? Check your spam folder or <a href="/password-reset/">try again</a>.</div>
  <a href="/" style="font-size:14px;">← Back to Login</a>
</div>
</body>
</html>
